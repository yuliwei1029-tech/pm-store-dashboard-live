<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一丰试点门店综合数据看板</title>
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --line:#dde3ec; --text:#16233b; --muted:#66738c;
  --blue:#2563eb; --teal:#0e8a78; --amber:#c07a1b; --ink:#0f1c33;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;letter-spacing:0;line-height:1.5}
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar .inner{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:9px}
.brand .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#2563eb,#0e8a78);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.topbar .meta{color:var(--muted);font-size:12px;text-align:right}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav a{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 12px;font-size:12.5px;color:#33415c;text-decoration:none}
.nav a:hover{border-color:#b9c6da;background:#f7f9fc}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.hero{padding:22px 0 4px}
.hero h1{font-size:23px;line-height:1.3;margin:0 0 6px;color:var(--ink)}
.hero p{margin:0;color:var(--muted);font-size:13px;max-width:900px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:#455066}
.chip b{color:var(--ink);font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.kpi .label{font-size:12.5px;color:var(--muted)}
.kpi .value{font-size:26px;font-weight:700;color:var(--ink);margin-top:5px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .note{font-size:12px;color:var(--muted);margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin:14px 0}
.panel h2{font-size:17px;margin:0 0 4px;color:var(--ink)}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin:14px 0}
.chart-card h3{font-size:16px;margin:0 0 2px;color:var(--ink)}
.chart-card .hint{font-size:12px;color:var(--muted);margin-bottom:10px}
.chart-svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#455066;margin:6px 0 2px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .line-mark{width:18px;height:0;border-top:3px solid var(--amber);margin-right:5px;display:inline-block;vertical-align:3px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:560px;font-size:13px}
th{background:#f8fafc;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);color:#5b6678;font-weight:600;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #edf1f5;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr:last-child td{font-weight:700;background:#f8fafc;border-bottom:0}
.rate-hi{color:#0e8a78;font-weight:600}
.rate-mid{color:#c07a1b;font-weight:600}
.rate-lo{color:#b3261e;font-weight:600}
.search input{width:260px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:13px;outline:none;background:#fff;color:var(--text);font-family:inherit}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.t-name{text-align:left;font-weight:600;color:var(--ink);cursor:pointer;display:block}
.t-name small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px}
.t-name:hover{color:var(--blue)}
tr:hover td{background:#f7faff}
.btn-open{display:inline-block;background:#2563eb;color:#fff;border:0;border-radius:6px;padding:5px 12px;font-size:12px;text-decoration:none;font-family:inherit;white-space:nowrap}
.btn-open:hover{background:#1d4ed8}
.footer{color:var(--muted);font-size:12px;padding:16px 0 30px}
@media (max-width:860px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .topbar .meta{text-align:left}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="inner">
    <div class="brand"><span class="logo">PM</span><span>一丰试点门店综合数据看板</span></div>
    <div class="nav"><a href="../00-看板目录.html">主目录</a></div>
  </div>
</div>
<div class="wrap">
  <div class="hero">
    <h1>一丰试点门店综合数据看板</h1>
    <p>共 7 个入口，内容结构与门店看板一致（4 项 KPI + 组合图近7天 + 每日明细 17日~最新日）。</p>
  </div>
  <div class="panel">
    <div class="table-wrap">
      <table>
        <thead><tr><th style="text-align:left">看板（点击进入）</th></tr></thead>
        <tbody><tr><td style="text-align:left"><a class="t-name" href="01-全部门店汇总数据.html">全国门店</a></td></tr><tr><td style="text-align:left"><a class="t-name" href="02-东部大区门店检测数据看板.html">东部大区门店检测数据看板</a></td></tr><tr><td style="text-align:left"><a class="t-name" href="03-西部大区门店检测数据看板.html">西部大区门店检测数据看板</a></td></tr><tr><td style="text-align:left"><a class="t-name" href="04-中部大区门店检测数据看板.html">中部大区门店检测数据看板</a></td></tr><tr><td style="text-align:left"><a class="t-name" href="05-南部大区门店检测数据看板.html">南部大区门店检测数据看板</a></td></tr><tr><td style="text-align:left"><a class="t-name" href="06-北部大区门店检测数据看板.html">北部大区门店检测数据看板</a></td></tr><tr><td style="text-align:left"><a class="t-name" href="07-地担负责门店检测数据看板.html">地担负责门店检测数据看板</a></td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="footer">数据口径：结算台次 = SNPM 文件内全部记录去重；检测台次（17-30日）= 厂端“是否检测”；31日起 = 当天结算VIN匹配当天X3接车单；累计检测台次(8/1起) = 累计X3（不限里程）。</div>
</div>
</body>
</html>
